<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      h2 {
        color: green;
      }
    </style>
    <script>
      function changeHeadingColor() {
        let heading2 = document.getElementById("heading2");

        if (heading2.style.color == "green") {
          heading2.style.color = "red";
        } else {
          heading2.style.color = "green";
        }

        heading2.innerHTML = "The text was changed by JavaScript";
        // heading2.style.display = "none";
        heading2.style.textDecoration = "underline";
        // heading2.style.border = "2px solid gray";
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1 class="text-primary mt-4">JS Demo</h1>
      <h2 id="heading2">
        JavaScript is used to add dynamic behaviour on Web Pages
      </h2>
      <button class="btn btn-danger mt-4" onclick="changeHeadingColor()">
        Click Me
      </button>
    </div>
  </body>
</html>
