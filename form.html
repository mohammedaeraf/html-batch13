<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css"
      rel="stylesheet"
    />
    <style>
      form {
        width: 500px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="text-primary my-5">Contact Us Form</h2>
      <form action="" class="border shadow p-5 rounded">
        <div class="mb-4">
          <input
            type="text"
            name="fullName"
            id="fullName"
            placeholder="Enter your full name"
            class="form-control"
          />
        </div>

        <div class="mb-4">
          <input
            type="email"
            name="emailId"
            id="emailId"
            placeholder="Enter your gmail or outlook id"
            class="form-control"
          />
        </div>

        <div class="mb-5">
          <textarea
            name="query"
            id="query"
            placeholder="Enter your query"
            class="form-control"
            rows="5"
          ></textarea>
        </div>

        <button class="btn btn-primary w-100">Submit</button>
      </form>
    </div>
  </body>
</html>
