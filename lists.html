<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Types of CSS</title>
    <style>
      ol {
        list-style-type: upper-alpha;
      }
      ul {
        list-style-type: square;
      }
    </style>
  </head>
  <body>
    <h1>Types of Lists</h1>
    <h3>2 Types of List</h3>
    <ul>
      <li>Ordered List</li>
      <li>Unordered List</li>
    </ul>
  </body>
</html>
