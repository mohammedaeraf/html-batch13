<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition Demo 2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css"
      rel="stylesheet"
    />
    <style>
      #team-photo {
        opacity: 0.5;
        transition: opacity 0.5s;
      }

      #team-photo:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="text-primary">Transition Demo 2</h2>
      <img
        src="img/our-team.jpg"
        alt="Team Photo"
        width="500px"
        class="rounded shadow img-fluid"
        id="team-photo"
      />
    </div>
  </body>
</html>
