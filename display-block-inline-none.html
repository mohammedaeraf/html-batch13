<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Inline, Block, Inline-Block and None</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css"
      rel="stylesheet"
    />
    <style>
      .box {
        width: 150px;
        height: 75px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <h1 class="text-primary">Display Inline, Block, Inline-Block and None</h1>
      <ul>
        <li>Inline</li>
        <li>Block</li>
        <li>Inline-Block</li>
        <li>None</li>
      </ul>

      <div class="bg-danger text-white m-2 p-3 box">Block</div>
      <div class="bg-danger text-white m-2 p-3 box">Block</div>
      <div class="bg-danger text-white m-2 p-3 box">Block</div>

      <div class="m-5"></div>

      <div class="bg-success text-white m-2 p-3 box d-inline">Inline</div>
      <div class="bg-success text-white m-2 p-3 box d-inline">Inline</div>
      <div class="bg-success text-white m-2 p-3 box d-inline">Inline</div>

      <div class="m-5"></div>

      <div class="bg-warning text-white m-2 p-3 box d-inline-block">
        Inline-Block
      </div>
      <div class="bg-warning text-white m-2 p-3 box d-inline-block">
        Inline-Block
      </div>
      <div class="bg-warning text-white m-2 p-3 box d-inline-block">
        Inline-Block
      </div>
    </div>
  </body>
</html>
