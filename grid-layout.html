<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-6 p-5 bg-primary text-white fw-bold">Section 1</div>
        <div class="col-md-6 p-5 bg-danger text-white fw-bold">Section 2</div>
      </div>

      <div class="row">
        <div class="col-sm-6 col-md-3 p-5 bg-warning text-white fw-bold">
          Section 1
        </div>
        <div class="col-sm-6 col-md-3 p-5 bg-success text-white fw-bold">
          Section 2
        </div>
        <div class="col-sm-6 col-md-3 p-5 bg-secondary text-white fw-bold">
          Section 3
        </div>
        <div class="col-sm-6 col-md-3 p-5 bg-info text-white fw-bold">
          Section 4
        </div>
      </div>
    </div>
  </body>
</html>
