<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexBox</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css"
      rel="stylesheet"
    />
  </head>
  <style>
    .flexbox {
      /* FlexBox Styles */
      display: flex;
      /* flex-start, flex-end, center, space-between, space-around, space-evenly*/
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      flex-direction: row;
      gap: 20px;

      min-height: 300px;
    }
    .box {
      width: 100px;
      height: 75px;
      color: white;
      text-align: center;
      padding-top: 10px;
      font-weight: bold;
    }
    .box1 {
      flex-grow: 1;
    }
    .box2 {
      flex-grow: 4;
    }
    .box3 {
      flex-grow: 1;
    }
  </style>
  <body>
    <div class="container">
      <div
        class="flexbox border border-3 border-dark d-flex justify-content-evenly align-items-center"
      >
        <div class="box box1 bg-primary">Box 1</div>
        <div class="box box2 bg-success">Box 2</div>
        <div class="box box3 bg-warning">Box 3</div>
      </div>
    </div>
  </body>
</html>
