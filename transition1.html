<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition Demo 1</title>
    <style>
      h2 {
        color: blue;
        font-family: Arial, Helvetica, sans-serif;
        transition: color 0.5s;
      }
      h2:hover {
        color: red;
      }
      p {
        width: 200px;
        min-height: 200px;
        padding: 6px;
        font-family: Arial, Helvetica, sans-serif;
        background-color: antiquewhite;
        border: 2px solid red;
        border-radius: 6px;
        transition: background-color 1s;
      }
      p:hover {
        background-color: rgb(205, 168, 119);
      }
    </style>
  </head>
  <body>
    <h2>Transition Demo 1</h2>
    <p></p>
  </body>
</html>
